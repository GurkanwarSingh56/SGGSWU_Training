<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topic 1: Punjabi Dhaba - Background Properties</title>
    <style>
        
        .dhaba-card {
            background-color: #fff9e6; 
            width: 400px;
            margin: 40px auto; 
            border: 5px solid #d35400; 
            border-radius: 10px;
            font-family: Arial, sans-serif;
            text-align: center;
            overflow: hidden; 
        }

       
        .decoration-top {
           
            background-image: url('https://via.placeholder.com/50x50/ff9f43/ffffff?text=Desi');
            
           
            background-repeat: repeat-x; 
            
            height: 50px;
            width: 100%;
        }

       
        .main-dish {
          
            background-image: url('https://images.unsplash.com/photo-1601050690597-df0568a70950?auto=format&fit=crop&w=400');
            
        
            background-repeat: no-repeat; 
            
           
            background-size: cover;       
            background-position: center;  
            
            height: 250px;
            width: 300px;
            
            margin: 20px auto; 
            border: 4px solid #27ae60; 
            border-radius: 8px;
        }

       
        .decoration-middle {
           
            background-image: url('https://via.placeholder.com/50x50/27ae60/ffffff?text=Lassi');
            
            
            background-repeat: repeat-y; 
            
           
            background-position: center; 
            
            height: 150px;
            width: 100%;
            margin-bottom: 20px;
        }

       
        h1 {
            color: #c0392b;
            margin: 15px 0 5px 0;
            font-size: 28px;
        }

        p {
            color: #555;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="dhaba-card">
      
        <div class="decoration-top"></div>
        
        <h1>🌾 Pind Da Dhaba</h1>
        <p>100% Pure Desi Swad!</p>
        
       
        <div class="main-dish"></div>
        
        <p>Try our Makki Di Roti & Sarson Da Saag</p>
        
       
        <div class="decoration-middle"></div>
    </div>

</body>
</html>
