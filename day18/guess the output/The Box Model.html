<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Topic 2: Box Model</title>
  <style>
    body {
      background-color: #e0e0e0;
      font-family: sans-serif;
    }

    .box {
      width: 200px;
      height: 100px;
      background-color: lightblue;
      padding: 30px;
      border: 10px solid black;
      margin: 40px;
    }
  </style>
</head>
<body>
  <div class="box">
    I am the Content. Notice the space between me and the thick black border (Padding), and the space between the border
    and the edge of the screen (Margin).
  </div>
  <div class="box">
    I am a second box. The Margin pushes me away from the first box.
  </div>
</body>

</html>
