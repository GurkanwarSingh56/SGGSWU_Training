    <!-- SESSION 3 (30 SEP): LISTS & PRACTICAL APPLICATIONS       -->
    <!-- Classwork: Food Ranking System                           -->
    <!-- Demonstrating Ordered (<ol>) and Unordered (<ul>) Lists  -->
    <!-- ======================================================== -->

    <!-- Main heading for the Food Ranking System classwork -->
    <h1>my fav food</h1>

    <!-- 
      ORDERED LIST (<ol>): 
      Used for ranked, sequential, or numbered items (Categories of food).
    -->
    <ol>
        <li>India Food</li>
        
        <!-- 
          UNORDERED LIST (<ul>): 
          Used for bulleted, non-sequential items nested inside the ordered list.
        -->
        <ul>
            <li>panner tikka</li>
            <li>Rajma chawal</li>
        </ul>

        <li>chinese food</li>
        
        <!-- Nested unordered list for Chinese food items -->
        <ul>
            <li>noodles</li>
            <li>pizza</li>
        </ul>
    </ol>
