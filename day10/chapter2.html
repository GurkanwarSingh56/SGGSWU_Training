<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chapter 2: Colors & Backgrounds</title>
    <style>
        body {
            /* Setting a background color using Hex code */
            background-color: #f2f2f2;
            padding: 20px;
        }

        .color-box {
            /* Using standard named color */
            background-color: cornflowerblue;
            /* Using Hex color for text */
            color: #ffffff;
            padding: 20px;
            margin-bottom: 10px;
            border-radius: 5px;
        }

        .rgb-box {
            /* Using RGB (Red, Green, Blue values from 0 to 255) */
            background-color: rgb(255, 99, 71);
            color: white;
            padding: 20px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <h1>Colors in CSS</h1>

    <div class="color-box">
        This box uses a named color background and white text.
    </div>

    <div class="rgb-box">
        This box uses RGB color values.
    </div>

</body>
</html>
