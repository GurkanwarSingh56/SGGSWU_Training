<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Topic 8: Media Queries</title>
  <style>
    /* DESKTOP STYLES (Default) */
    .responsive-layout {
      display: flex;
      flex-direction: row; 
      background-color: teal;
      padding: 20px;
    }
    
    .box {
      background: white;
      margin: 10px;
      padding: 30px;
      width: 100%;
      text-align: center;
      font-size: 24px;
    }

    
    @media (max-width: 600px) {
      .responsive-layout {
        flex-direction: column; 
        background-color: orange; 
      }
      
      .box {
        font-size: 16px; 
      }
    }
  </style>
</head>
<body>
  <h2>Resize your browser window!</h2>
  <div class="responsive-layout">
    <div class="box">Section A</div>
    <div class="box">Section B</div>
    <div class="box">Section C</div>
  </div>
</body>
</html>
