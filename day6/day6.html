<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session 6: Data Tables</title>
</head>
<body>

    <!-- ======================================================== -->
    <!-- SESSION 6 (7 OCT): DATA TABLES                          -->
    <!-- Creating tabular data layouts using <table>, <tr>, <th>, -->
    <!-- and <td> without adding custom CSS.                      -->
    <!-- ======================================================== -->

    <h1>Today I will learn the table</h1>

    <!-- Improved HTML table structure using native border and padding attributes -->
    <table border="1" cellpadding="10" cellspacing="0">
        <thead>
            <tr>
                <th>S No</th>
                <th>Name</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>Gurkanwar Singh</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
