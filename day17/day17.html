<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Alignment & Span</title>
    <style>
        .parent {
            /* Container Dimensions */
            height: 800px;
            width: 1000px;
            border: 2px solid red;
            
            /* 1. INITIALIZE GRID CONTAINER */
            display: grid;

            /* 2. DEFINE COLUMNS */
            /* repeat(5, 1fr) creates 5 equal columns taking up available space */
            grid-template-columns: repeat(5, 100px); 

            /* 3. DEFINE ROWS */
            /* Using auto or fixed size so rows don't stretch fully, making align-content visible */
            grid-template-rows: repeat(4, 100px);

            /* 
              ========================================================
              4. GRID CONTAINER ALIGNMENT PROPERTIES
              ========================================================
            */
            
            /* justify-content: Aligns the ENTIRE grid horizontally inside the container */
            /* Options: start, end, center, stretch, space-between, space-around, space-evenly */
            justify-content: space-around;

            /* align-content: Aligns the ENTIRE grid vertically inside the container */
            /* Options: start, end, center, stretch, space-between, space-around, space-evenly */
            align-content: center;

            /* Gap between rows and columns */
            gap: 15px;
            padding: 10px;
        }

        .child {
            border: 2px solid #000;
            background-color: aqua;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .child1 {
            /* 
              5. GRID ITEM SPANNING 
              - grid-column: start_line / end_line
              - Spans from grid line 3 to line 5 (covering 2 columns)
            */
            grid-column: 3 / 5;
            background-color: orange;
        }
    </style>
</head>
<body>

    <h2>CSS Grid: Alignment & Spanning</h2>

    <div class="parent">
        <div class="child">1</div>
        <div class="child">2</div>
        <div class="child">3</div>
        <div class="child">4</div>
        <div class="child">5</div>
        <div class="child">6</div>
       
        <!-- Spans across columns 3 to 5 -->
        <div class="child child1">7 (Span)</div>
        <div class="child">8</div>
        <div class="child">9</div>
        <div class="child">10</div>
        <div class="child">11</div>
        <div class="child">12</div>
        <div class="child">13</div>
        <div class="child">14</div>
        <div class="child">15</div>
    </div>

</body>
</html>
