   <!-- 
  ==========================================================================
  SESSION 1: INTRODUCTION TO WEB DEVELOPMENT & CORE TECHNOLOGIES
  ==========================================================================
  
  This document serves as the Day 1 reference guide containing definitions 
  and summaries of the core technologies covered in the bootcamp.
  
  ---
  1. HTML (HyperText Markup Language)
  ---
  - What it is: The standard markup language used to create the structure and 
    content of web pages.
  - Purpose: Defines elements like headings, paragraphs, links, images, and forms.
  
  ---
  2. CSS (Cascading Style Sheets)
  ---
  - What it is: A style sheet language used for describing the presentation 
    of a document written in HTML.
  - Purpose: Controls layout, colors, fonts, responsiveness, and visual styling.
  
  ---
  3. JavaScript (JS)
  ---
  - What it is: A high-level, interpreted programming language that conforms 
    to the ECMAScript specification.
  - Purpose: Adds dynamic behavior, interactivity, logic, and asynchronous 
    operations to web pages.
  
  ---
  4. Node.js
  ---
  - What it is: A JavaScript runtime built on Chrome's V8 JavaScript engine.
  - Purpose: Allows developers to run JavaScript code outside the browser, 
    enabling backend server-side development.
  
  ---
  5. React.js
  ---
  - What it is: A popular open-source frontend JavaScript library.
  - Purpose: Builds reusable UI components and manages dynamic state efficiently 
    using a virtual DOM.
  
  ---
  6. Express.js
  ---
  - What it is: A minimal and flexible Node.js web application framework.
  - Purpose: Simplifies server-side routing, middleware integration, and API 
    development for backend applications.
  
  ---
  7. Full-Stack Development
  ---
  - What it is: The practice of developing both the frontend (client-side) 
    and backend (server-side) portions of a web application.
  - Purpose: Covers everything from user interfaces and databases to server logic 
    and deployment.
  
  ---
  8. Version Control (Git)
  ---
  - What it is: A distributed version control system for tracking changes in 
    source code during software development.
  - Purpose: Allows multiple developers to collaborate, track history, revert 
    mistakes, and manage branches safely.
  
  ---
  9. Use of GitHub
  ---
  - What it is: A cloud-based hosting platform for Git repositories.
  - Purpose: Enables code sharing, remote backups, collaborative code reviews (PRs), 
    issue tracking, and continuous deployment workflows.
  ==========================================================================
